<mat-card>
  <mat-card-header>
    <mat-card-title>
      <h2>Gestión de Periodos de Fiscalización</h2>
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="toolbar">
      <div class="actions">
        <button mat-raised-button color="primary" (click)="crear()">
          <mat-icon>add</mat-icon>
          Nuevo Periodo
        </button>
      </div>
      
      <div class="filters">
        <button mat-button 
                [color]="filtroEstado === 'todos' ? 'primary' : ''"
                (click)="filtrarPorEstado('todos')">
          Todos
        </button>
        <button mat-button 
                [color]="filtroEstado === 'activos' ? 'primary' : ''"
                (click)="filtrarPorEstado('activos')">
          Activos
        </button>
        <button mat-button 
                [color]="filtroEstado === 'inactivos' ? 'primary' : ''"
                (click)="filtrarPorEstado('inactivos')">
          Inactivos
        </button>
      </div>
    </div>

    <table mat-table [dataSource]="periodos" class="mat-elevation-z2">
      <ng-container matColumnDef="codigoPeriodo">
        <th mat-header-cell *matHeaderCellDef>Código</th>
        <td mat-cell *matCellDef="let periodo"><strong>{{periodo.codigoPeriodo}}</strong></td>
      </ng-container>

      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let periodo">{{periodo.descripcion}}</td>
      </ng-container>

      <ng-container matColumnDef="fechaInicio">
        <th mat-header-cell *matHeaderCellDef>Fecha Inicio</th>
        <td mat-cell *matCellDef="let periodo">{{periodo.fechaInicio}}</td>
      </ng-container>

      <ng-container matColumnDef="fechaFin">
        <th mat-header-cell *matHeaderCellDef>Fecha Fin</th>
        <td mat-cell *matCellDef="let periodo">{{periodo.fechaFin}}</td>
      </ng-container>

      <ng-container matColumnDef="deEstado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let periodo">
          <mat-chip [color]="getEstadoColor(periodo.deEstado)">
            {{periodo.deEstado}}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="diasRestantes">
        <th mat-header-cell *matHeaderCellDef>Días Restantes</th>
        <td mat-cell *matCellDef="let periodo">
          <span [class.text-danger]="getDiasRestantes(periodo) === 0 && periodo.deEstado === 'Cerrado'"
                [class.text-warning]="getDiasRestantes(periodo) > 0 && getDiasRestantes(periodo) <= 30">
            {{getDiasRestantes(periodo)}}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let periodo">
          <button mat-icon-button color="primary" (click)="editar(periodo)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button 
                  color="accent"
                  (click)="ampliarVigencia(periodo)"
                  [disabled]="!puedeAmpliar(periodo)"
                  matTooltip="Ampliar Vigencia">
            <mat-icon>event</mat-icon>
          </button>
          <button mat-icon-button 
                  [color]="periodo.estadoActivo ? 'warn' : 'accent'" 
                  (click)="cambiarEstado(periodo)"
                  [disabled]="!puedeCambiarEstado(periodo)"
                  [matTooltip]="periodo.deEstado === 'Cerrado' ? 'No se puede cambiar estado de periodo cerrado' : (periodo.estadoActivo ? 'Desactivar' : 'Activar')">
            <mat-icon>{{periodo.estadoActivo ? 'toggle_on' : 'toggle_off'}}</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="eliminar(periodo)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
          No hay periodos registrados
        </td>
      </tr>
    </table>
  </mat-card-content>
</mat-card>
