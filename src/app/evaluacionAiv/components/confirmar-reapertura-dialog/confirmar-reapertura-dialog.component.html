<h2 mat-dialog-title>Reabrir evaluación</h2>
<mat-dialog-content>
  <div class="info-evaluacion">
    <div><strong>Empresa:</strong> {{ data.evaluacion.codigoEmpresa }}</div>
    <div><strong>Periodo:</strong> {{ data.evaluacion.codigoPeriodo }}</div>
    <div><strong>Fecha evaluada:</strong> {{ data.evaluacion.fechaInicio ?? '—' }} — {{ data.evaluacion.fechaFin ?? '—' }}</div>
  </div>

  <mat-form-field appearance="outline" class="campo-completo">
    <mat-label>Motivo de reapertura</mat-label>
    <textarea matInput rows="3" [(ngModel)]="motivo" required></textarea>
  </mat-form-field>

  <mat-form-field appearance="outline" class="campo-completo">
    <mat-label>Tipo de reapertura</mat-label>
    <mat-select [(ngModel)]="tipoReapertura" required>
      <mat-option *ngFor="let tipo of tiposReapertura" [value]="tipo">{{ tipo }}</mat-option>
    </mat-select>
  </mat-form-field>

  <div class="campo-archivo">
    <label>Cargar sustento</label>
    <input type="file" (change)="onArchivoSeleccionado($event)" />
    <span *ngIf="archivoSustento" class="nombre-archivo">{{ archivoSustento.name }}</span>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-raised-button color="warn" (click)="reabrir()" [disabled]="guardando()">Reabrir</button>
  <button mat-stroked-button (click)="cancelar()" [disabled]="guardando()">Cancelar</button>
</mat-dialog-actions>
