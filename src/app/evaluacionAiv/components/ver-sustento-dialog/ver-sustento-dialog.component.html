<h2 mat-dialog-title>Sustentos — {{ data.codigoUnicoAtencion }}</h2>
<mat-dialog-content>
  <div class="carga-sustento">
    <input type="file" (change)="onArchivoSeleccionado($event)" />
    <button mat-stroked-button color="primary" [disabled]="!archivoSeleccionado" (click)="cargar()">
      <mat-icon>upload</mat-icon> Cargar
    </button>
  </div>

  <table mat-table [dataSource]="sustentos()" class="mat-elevation-z1">
    <ng-container matColumnDef="nombreArchivo">
      <th mat-header-cell *matHeaderCellDef>Archivo</th>
      <td mat-cell *matCellDef="let s">{{ s.nombreArchivo }}</td>
    </ng-container>
    <ng-container matColumnDef="tamanioBytes">
      <th mat-header-cell *matHeaderCellDef>Tamaño (bytes)</th>
      <td mat-cell *matCellDef="let s">{{ s.tamanioBytes }}</td>
    </ng-container>
    <ng-container matColumnDef="origen">
      <th mat-header-cell *matHeaderCellDef>Origen</th>
      <td mat-cell *matCellDef="let s">{{ s.origen }}</td>
    </ng-container>
    <ng-container matColumnDef="fechaCarga">
      <th mat-header-cell *matHeaderCellDef>Fecha de carga</th>
      <td mat-cell *matCellDef="let s">{{ s.fechaCarga }}</td>
    </ng-container>
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let s">
        <button mat-icon-button (click)="descargar(s)" title="Descargar"><mat-icon>download</mat-icon></button>
        <button mat-icon-button color="warn" (click)="eliminar(s)" title="Eliminar"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <p *ngIf="!sustentos().length" class="sin-sustentos">No hay sustentos cargados para este registro.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="cerrar()">Cerrar</button>
</mat-dialog-actions>
