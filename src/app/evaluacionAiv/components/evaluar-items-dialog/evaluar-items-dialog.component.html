<h2 mat-dialog-title>Evaluar ítems</h2>
<mat-dialog-content>
  <p class="mensaje-consolidada" *ngIf="data.soloLectura">
    Esta evaluación está consolidada. Reábrala (RF09) para poder modificar los ítems.
  </p>

  <div class="datos-solo-lectura">
    <mat-form-field appearance="outline">
      <mat-label>Código único</mat-label>
      <input matInput [value]="data.registro.codigoUnico ?? '—'" readonly />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Número de suministro</mat-label>
      <input matInput value="—" readonly />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Ap. Usuario</mat-label>
      <input matInput [value]="data.registro.usuario ?? '—'" readonly />
    </mat-form-field>
  </div>

  <div class="item" *ngFor="let item of catalogo">
    <span class="item-descripcion">{{ item.orden }}. {{ item.descripcion }}</span>
    <mat-radio-group [ngModel]="cumplePorItem[item.codigoItem]"
                      [disabled]="data.soloLectura || itemBloqueadoPorAutoIncumple(item.codigoItem)"
                      (change)="seleccionarCumple(item.codigoItem, $event.value)">
      <mat-radio-button [value]="true">Cumple</mat-radio-button>
      <mat-radio-button [value]="false">No cumple</mat-radio-button>
    </mat-radio-group>
    <span class="auto-incumple" *ngIf="itemBloqueadoPorAutoIncumple(item.codigoItem)">
      Incumplimiento automático por ITEM_02
    </span>
  </div>

  <mat-form-field appearance="outline" class="justificacion-field">
    <mat-label>Justificación *</mat-label>
    <textarea matInput rows="4" [(ngModel)]="justificacion" [readonly]="data.soloLectura" placeholder="Ingresar justificación"></textarea>
  </mat-form-field>

  <button mat-stroked-button color="accent" (click)="abrirSustento()">
    <mat-icon>attach_file</mat-icon> Cargar/Ver sustento
  </button>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="cancelar()" [disabled]="guardando">{{ data.soloLectura ? 'Cerrar' : 'Cancelar' }}</button>
  <button mat-raised-button color="primary" (click)="guardar()" [disabled]="guardando || data.soloLectura" *ngIf="!data.soloLectura">Guardar</button>
</mat-dialog-actions>
