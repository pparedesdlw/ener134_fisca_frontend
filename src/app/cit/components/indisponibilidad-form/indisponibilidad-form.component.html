<h2 mat-dialog-title>Nueva Indisponibilidad</h2>

<mat-dialog-content>
  <form [formGroup]="form">

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Fecha y Hora Inicio</mat-label>
      <input matInput type="datetime-local" formControlName="fechaInicio">
      <mat-error *ngIf="form.get('fechaInicio')?.hasError('required')">
        La fecha de inicio es obligatoria
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Fecha y Hora Fin</mat-label>
      <input matInput type="datetime-local" formControlName="fechaFin">
      <mat-error *ngIf="form.get('fechaFin')?.hasError('required')">
        La fecha de fin es obligatoria
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Motivo</mat-label>
      <textarea matInput formControlName="motivo" rows="3"
                placeholder="Describa el motivo de la indisponibilidad"></textarea>
      <mat-hint align="end">{{ form.get('motivo')?.value?.length || 0 }}/500</mat-hint>
      <mat-error *ngIf="form.get('motivo')?.hasError('required')">
        El motivo es obligatorio
      </mat-error>
      <mat-error *ngIf="form.get('motivo')?.hasError('minlength')">
        El motivo debe tener al menos 5 caracteres
      </mat-error>
      <mat-error *ngIf="form.get('motivo')?.hasError('maxlength')">
        El motivo no puede exceder los 500 caracteres
      </mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="guardar()" [disabled]="form.invalid">
    Registrar
  </button>
</mat-dialog-actions>
