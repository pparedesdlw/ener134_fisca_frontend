<mat-card>
  <mat-card-header>
    <mat-card-title>
      <h2>Indisponibilidades del Sistema</h2>
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="toolbar">
      <div class="actions">
        <button mat-raised-button color="primary" (click)="crear()">
          <mat-icon>add</mat-icon>
          Nueva Indisponibilidad
        </button>
      </div>

      <div class="filters">
        <button mat-button
                [color]="filtroEstado === 'todos' ? 'primary' : ''"
                (click)="filtrarPorEstado('todos')">
          Todos
        </button>
        <button mat-button
                [color]="filtroEstado === 'activos' ? 'primary' : ''"
                (click)="filtrarPorEstado('activos')">
          Activos
        </button>
        <button mat-button
                [color]="filtroEstado === 'inactivos' ? 'primary' : ''"
                (click)="filtrarPorEstado('inactivos')">
          Inactivos
        </button>
      </div>
    </div>

    <table mat-table [dataSource]="indisponibilidades" class="mat-elevation-z2">

      <ng-container matColumnDef="fechaInicioIndisponibilidad">
        <th mat-header-cell *matHeaderCellDef>Fecha Inicio</th>
        <td mat-cell *matCellDef="let item">
          <strong>{{ formatearFecha(item.fechaInicioIndisponibilidad) }}</strong>
        </td>
      </ng-container>

      <ng-container matColumnDef="fechaFinIndisponibilidad">
        <th mat-header-cell *matHeaderCellDef>Fecha Fin</th>
        <td mat-cell *matCellDef="let item">
          <strong>{{ formatearFecha(item.fechaFinIndisponibilidad) }}</strong>
        </td>
      </ng-container>

      <ng-container matColumnDef="motivo">
        <th mat-header-cell *matHeaderCellDef>Motivo</th>
        <td mat-cell *matCellDef="let item">{{ item.motivo }}</td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let item">
          <mat-chip [color]="getEstadoColor(item.estado)">
            {{ item.estado }}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let item">
          <button mat-icon-button color="warn"
                  (click)="desactivar(item)"
                  matTooltip="Desactivar"
                  [disabled]="item.estado !== 'Activo'">
            <mat-icon>block</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
          No hay indisponibilidades registradas
        </td>
      </tr>
    </table>
  </mat-card-content>
</mat-card>
