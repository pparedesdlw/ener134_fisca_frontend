<mat-card>
  <mat-card-title>Indicadores y gráficos</mat-card-title>
  <mat-card-content>
    <section>
      <h3>Evolución de indicadores por empresa</h3>
      <p class="etiqueta-selector">Empresa:</p>
      <div class="grid-selector" role="listbox" aria-label="Empresa">
        <button
          *ngFor="let empresa of empresas()"
          type="button"
          class="tile-selector"
          [class.seleccionado]="empresa.id === empresaSeleccionada"
          [attr.aria-selected]="empresa.id === empresaSeleccionada"
          [matTooltip]="empresa.razonSocial"
          (click)="seleccionarEmpresa(empresa.id)">
          {{ empresa.codigoEmpresa }}
        </button>
      </div>
      <p class="ayuda-selector">* Seleccione una empresa para visualizar los resultados.</p>

      <div *ngIf="cargandoEvolucion()" class="spinner-container">
        <mat-spinner diameter="32"></mat-spinner>
      </div>

      <div class="graficos-lado-a-lado" *ngIf="hayEvolucion() && evolucion() as ev">
        <app-bar-chart
          titulo="Indicador AIV — Evolución en el tiempo"
          [labels]="labelsEvolucion()"
          [valores]="valoresAivEvolucion()"
          [tolerancia]="ev.toleranciaAiv"
          colorBarra="#1565c0">
        </app-bar-chart>
        <app-bar-chart
          titulo="Indicador CIT — Evolución en el tiempo"
          [labels]="labelsEvolucion()"
          [valores]="valoresCitEvolucion()"
          [tolerancia]="ev.toleranciaCit"
          colorBarra="#6a1b9a">
        </app-bar-chart>
      </div>

      <p *ngIf="sinDatosEvolucion()" class="mensaje-sin-datos">{{ MENSAJE_SIN_DATOS }}</p>
    </section>

    <section>
      <h3>Comparativo de indicadores por periodo</h3>
      <p class="etiqueta-selector">Periodo:</p>
      <div class="grid-selector" role="listbox" aria-label="Periodo">
        <button
          *ngFor="let periodo of periodos()"
          type="button"
          class="tile-selector"
          [class.seleccionado]="periodo.codigoPeriodo === periodoSeleccionado"
          [attr.aria-selected]="periodo.codigoPeriodo === periodoSeleccionado"
          [matTooltip]="periodo.descripcion ?? ''"
          (click)="seleccionarPeriodo(periodo.codigoPeriodo)">
          {{ periodo.codigoPeriodo }}
        </button>
      </div>
      <p class="ayuda-selector">* Seleccione un periodo para visualizar los resultados.</p>

      <div *ngIf="cargandoComparativo()" class="spinner-container">
        <mat-spinner diameter="32"></mat-spinner>
      </div>

      <div class="graficos-lado-a-lado" *ngIf="hayComparativo() && comparativo() as comp">
        <app-bar-chart
          titulo="Indicador AIV — Comparativo por empresa"
          [labels]="labelsComparativo()"
          [valores]="valoresAivComparativo()"
          [tolerancia]="comp.toleranciaAiv"
          colorBarra="#1565c0">
        </app-bar-chart>
        <app-bar-chart
          titulo="Indicador CIT — Comparativo por empresa"
          [labels]="labelsComparativo()"
          [valores]="valoresCitComparativo()"
          [tolerancia]="comp.toleranciaCit"
          colorBarra="#6a1b9a">
        </app-bar-chart>
      </div>

      <p *ngIf="sinDatosComparativo()" class="mensaje-sin-datos">{{ MENSAJE_SIN_DATOS }}</p>
    </section>
  </mat-card-content>
</mat-card>
