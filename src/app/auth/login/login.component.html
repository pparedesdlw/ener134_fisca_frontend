<div class="login-layout">

  <div class="login-image">
    <div class="overlay">
      <img src="auth.jpg" alt="Fondo de autenticación" class="login-background">
    </div>
  </div>

  <div class="login-form">
    <mat-card class="card">
      <div class="card-header">
        <div class="logo-container">
        </div>
        <h2>Bienvenido a TISEC</h2>
        <p class="subtitle">Ingresa tus credenciales para continuar</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="login()" class="login-form-content">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Usuario</mat-label>
          <input matInput formControlName="username" placeholder="Ingresa tu usuario" />
          <mat-icon matSuffix>person_outline</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="Ingresa tu contraseña" />
          <button type="button" mat-icon-button matSuffix (click)="hidePassword = !hidePassword">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          class="login-button"
          type="submit"
          [disabled]="form.invalid"

          >
          <mat-icon>login</mat-icon>
          <span>Iniciar sesión</span>
        </button>
      </form>

      <div class="footer">
        <p>© 2026 OSINERGMIN - TISEC</p>
      </div>
    </mat-card>
  </div>

</div>
