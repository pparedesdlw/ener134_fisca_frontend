<mat-card>
  <mat-card-header>
    <mat-card-title>
      <h2>Roles</h2>
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="toolbar">
      <div class="actions">
        <button mat-raised-button color="primary" (click)="crear()">
          <mat-icon>add</mat-icon>
          Nuevo Rol
        </button>
      </div>

      <div class="filters">
        <button mat-button
                [color]="filtroEstado === 'todos' ? 'primary' : ''"
                (click)="filtrarPorEstado('todos')">
          Todos
        </button>
        <button mat-button
                [color]="filtroEstado === 'activos' ? 'primary' : ''"
                (click)="filtrarPorEstado('activos')">
          Activos
        </button>
        <button mat-button
                [color]="filtroEstado === 'inactivos' ? 'primary' : ''"
                (click)="filtrarPorEstado('inactivos')">
          Inactivos
        </button>
      </div>

    </div>

    <table mat-table [dataSource]="roles" class="mat-elevation-z2">
      <ng-container matColumnDef="codigoRol">
        <th mat-header-cell *matHeaderCellDef>Código</th>
        <td mat-cell *matCellDef="let rol"><strong>{{rol.codigoRol}}</strong></td>
      </ng-container>

      <ng-container matColumnDef="responsableRol">
        <th mat-header-cell *matHeaderCellDef>Responsable Rol</th>
        <td mat-cell *matCellDef="let rol">{{rol.responsableRol}}</td>
      </ng-container>

      <ng-container matColumnDef="descripcionRol">
        <th mat-header-cell *matHeaderCellDef>Descripción Rol</th>
        <td mat-cell *matCellDef="let rol">{{rol.descripcionRol}}</td>
      </ng-container>

      <ng-container matColumnDef="deEstado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let rol">
          <mat-chip [color]="getEstadoColor(rol.deEstado)">
            {{rol.deEstado}}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let rol">
          <button mat-icon-button color="primary" (click)="editar(rol)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="eliminar(rol)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
          No hay roles registrados
        </td>
      </tr>
    </table>
  </mat-card-content>
</mat-card>
