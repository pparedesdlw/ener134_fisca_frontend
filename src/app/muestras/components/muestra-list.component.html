<mat-card>
  <mat-card-header>
    <mat-card-title>
      <h2>Muestras</h2>
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="toolbar">
      <div class="actions">
        <button mat-raised-button color="primary" (click)="crear()">
          <mat-icon>add</mat-icon>
          Nueva Muestra
        </button>
      </div>

      <div class="filters">
        <button mat-button 
                [color]="filtroEstado === 'todos' ? 'primary' : ''"
                (click)="filtrarPorEstado('todos')">
          Todos
        </button>
        <button mat-button 
                [color]="filtroEstado === 'activos' ? 'primary' : ''"
                (click)="filtrarPorEstado('activos')">
          Activos
        </button>
        <button mat-button 
                [color]="filtroEstado === 'inactivos' ? 'primary' : ''"
                (click)="filtrarPorEstado('inactivos')">
          Inactivos
        </button>
      </div>

    </div>

    <table mat-table [dataSource]="muestras" class="mat-elevation-z2">
      <ng-container matColumnDef="codigoMuestra">
        <th mat-header-cell *matHeaderCellDef>Código</th>
        <td mat-cell *matCellDef="let muestra"><strong>{{muestra.codigoMuestra}}</strong></td>
      </ng-container>

      <ng-container matColumnDef="muestra">
        <th mat-header-cell *matHeaderCellDef>Tamaño Muestra</th>
        <td mat-cell *matCellDef="let muestra">{{muestra.muestra}} atenciones</td>
      </ng-container>

      <ng-container matColumnDef="confianza">
        <th mat-header-cell *matHeaderCellDef>Nivel Confianza</th>
        <td mat-cell *matCellDef="let muestra">{{muestra.confianza}}% confianza</td>
      </ng-container>

      <ng-container matColumnDef="error">
        <th mat-header-cell *matHeaderCellDef>Margen Error</th>
        <td mat-cell *matCellDef="let muestra">{{muestra.error}}% error</td>
      </ng-container>

      <ng-container matColumnDef="deEstado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let muestra">
          <mat-chip [color]="getEstadoColor(muestra.deEstado)">
            {{muestra.deEstado}}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let muestra">
          <button mat-icon-button color="primary" (click)="editar(muestra)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="eliminar(muestra)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
          No hay muestras registradas
        </td>
      </tr>
    </table>
  </mat-card-content>
</mat-card>
