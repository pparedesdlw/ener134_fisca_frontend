<mat-sidenav-container class="sidenav-container">
  <mat-sidenav mode="side" opened class="sidenav">
    <div class="sidenav-header">
      <h2>OSINERGMIN</h2>
      <p>Fiscalización v.1.0.4</p>
    </div>

    <div class="menu-sections">
      <mat-accordion [multi]="true" displayMode="flat">
        <mat-expansion-panel *ngFor="let section of menuSections" [expanded]="section.expanded" class="menu-section">
          <mat-expansion-panel-header>
            <mat-panel-title>
              <mat-icon class="section-icon">{{section.icon}}</mat-icon>
              <span class="section-label">{{section.label}}</span>
            </mat-panel-title>
          </mat-expansion-panel-header>

          <mat-nav-list>
            <ng-container *ngFor="let sub of section.subsections">
              <div class="subsection-header">{{sub.label}}</div>
              <ng-container *ngFor="let item of sub.items">
                <a mat-list-item *ngIf="!item.disabled" [routerLink]="item.path" routerLinkActive="active"
                  class="menu-item">
                  <span matListItemTitle>{{item.label}}</span>
                </a>
                <a mat-list-item *ngIf="item.disabled" class="menu-item disabled">
                  <span matListItemTitle>{{item.label}}</span>
                </a>
              </ng-container>
            </ng-container>
          </mat-nav-list>
        </mat-expansion-panel>
      </mat-accordion>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <span>Sistema de Fiscalización</span>
      <span class="spacer"></span>
      <span style="margin-right: 10px;" *ngIf="authService.currentUser | async as user">
        {{ user.nombre }}
      </span>
      <button mat-icon-button (click)="logout()" matTooltip="Cerrar Sesión">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
