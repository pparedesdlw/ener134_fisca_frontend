<mat-card>
  <mat-card-header>
    <mat-card-title>
      <h2>Responsables</h2>
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="toolbar">
      <div class="actions">
        <button mat-raised-button color="primary" (click)="crear()">
          <mat-icon>add</mat-icon>
          Nuevo Responsable
        </button>
      </div>

      <div class="filters">
        <button mat-button 
                [color]="filtroEstado === 'todos' ? 'primary' : ''"
                (click)="filtrarPorEstado('todos')">
          Todos
        </button>
        <button mat-button 
                [color]="filtroEstado === 'activos' ? 'primary' : ''"
                (click)="filtrarPorEstado('activos')">
          Activos
        </button>
        <button mat-button 
                [color]="filtroEstado === 'inactivos' ? 'primary' : ''"
                (click)="filtrarPorEstado('inactivos')">
          Inactivos
        </button>
      </div>

    </div>

    <table mat-table [dataSource]="responsables" class="mat-elevation-z2">
      <ng-container matColumnDef="codigoResponsable">
        <th mat-header-cell *matHeaderCellDef>Código</th>
        <td mat-cell *matCellDef="let responsable"><strong>{{responsable.codigoResponsable}}</strong></td>
      </ng-container>

      <ng-container matColumnDef="nombreResponsable">
        <th mat-header-cell *matHeaderCellDef>Especialista Regional</th>
        <td mat-cell *matCellDef="let responsable">{{responsable.nombreResponsable}}</td>
      </ng-container>

      <ng-container matColumnDef="codigoEmpresa">
        <th mat-header-cell *matHeaderCellDef>Código Empresa</th>
        <td mat-cell *matCellDef="let responsable">{{responsable.codigoEmpresa}}</td>
      </ng-container>

      <ng-container matColumnDef="deEstado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let responsable">
          <mat-chip [color]="getEstadoColor(responsable.deEstado)">
            {{responsable.deEstado}}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let responsable">
          <button mat-icon-button color="primary" (click)="editar(responsable)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="eliminar(responsable)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
          No hay responsables registrados
        </td>
      </tr>
    </table>
  </mat-card-content>
</mat-card>
